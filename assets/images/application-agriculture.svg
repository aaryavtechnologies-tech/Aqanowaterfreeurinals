<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="agrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <filter id="shadowA" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#15803D" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#agrBg)" />

  <!-- Agricultural Farm Scene -->
  <g transform="translate(150, 70)" filter="url(#shadowA)">
    <!-- Sun -->
    <circle cx="250" cy="40" r="28" fill="#FBBF24" />
    <!-- Rolling Green Hills -->
    <path d="M-30 180 Q 80 110 180 180 Q 260 140 330 180 L 330 220 L -30 220 Z" fill="#22C55E" />
    <path d="M-30 200 Q 120 150 250 200 Q 300 180 330 200 L 330 220 L -30 220 Z" fill="#15803D" />

    <!-- Drip Irrigation Line & Water Droplets -->
    <line x1="0" y1="210" x2="300" y2="210" stroke="#0284C7" stroke-width="4" stroke-dasharray="10 5" />

    <!-- Sprouting Plants -->
    <g transform="translate(40, 160)">
      <path d="M10 30 Q 0 10 20 0 Q 15 15 10 30" fill="#86EFAC" />
      <path d="M10 30 Q 25 12 3 5 Q 8 18 10 30" fill="#4ADE80" />
    </g>
    <g transform="translate(130, 150)">
      <path d="M10 35 Q 0 10 25 0 Q 18 18 10 35" fill="#86EFAC" />
      <path d="M10 35 Q 28 12 5 5 Q 10 20 10 35" fill="#4ADE80" />
    </g>
    <g transform="translate(220, 160)">
      <path d="M10 30 Q 0 10 20 0 Q 15 15 10 30" fill="#86EFAC" />
      <path d="M10 30 Q 25 12 3 5 Q 8 18 10 30" fill="#4ADE80" />
    </g>

    <!-- Crop icon -->
    <circle cx="20" cy="50" r="28" fill="#FFFFFF" />
    <text x="20" y="58" font-size="22" text-anchor="middle">🌾</text>
  </g>

  <!-- Title & Features -->
  <rect x="40" y="280" width="520" height="90" rx="12" fill="#FFFFFF" filter="url(#shadowA)" />
  <text x="60" y="312" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#0F172A">Agriculture, Farms &amp; Drip Irrigation</text>
  <text x="60" y="336" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Unclogs drip irrigation emitters &amp; borewell pump discharge nozzles</text>
  <text x="60" y="354" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Improves soil water penetration, crop root hydration &amp; agricultural yield</text>
</svg>
