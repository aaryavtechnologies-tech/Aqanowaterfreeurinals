<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="indBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="shadowI" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#334155" flood-opacity="0.18" />
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#indBg)" />

  <!-- Industrial Plant Graphic -->
  <g transform="translate(140, 70)" filter="url(#shadowI)">
    <!-- Factory silhouette -->
    <polygon points="20,190 20,110 70,70 70,110 120,70 120,110 170,70 170,190" fill="#334155" />
    <!-- Smokestacks -->
    <rect x="200" y="40" width="30" height="150" fill="#475569" />
    <rect x="245" y="60" width="25" height="130" fill="#64748B" />
    <!-- Cooling Tower -->
    <path d="M290 190 Q 295 140 285 100 L 335 100 Q 325 140 330 190 Z" fill="#0284C7" />
    <!-- Factory windows -->
    <g fill="#F8FAFC">
      <rect x="40" y="130" width="18" height="18" />
      <rect x="75" y="130" width="18" height="18" />
      <rect x="110" y="130" width="18" height="18" />
      <rect x="145" y="130" width="18" height="18" />
      <rect x="40" y="160" width="18" height="18" />
      <rect x="75" y="160" width="18" height="18" />
      <rect x="110" y="160" width="18" height="18" />
      <rect x="145" y="160" width="18" height="18" />
    </g>

    <!-- Gear / Efficiency icon -->
    <circle cx="10" cy="80" r="28" fill="#FFFFFF" />
    <text x="10" y="88" font-size="22" text-anchor="middle">⚙️</text>
  </g>

  <!-- Title & Features -->
  <rect x="40" y="280" width="520" height="90" rx="12" fill="#FFFFFF" filter="url(#shadowI)" />
  <text x="60" y="312" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#0F172A">Factories, Boilers &amp; Cooling Towers</text>
  <text x="60" y="336" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Eliminates boiler scaling, heat exchanger fouling &amp; chiller head loss</text>
  <text x="60" y="354" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Cuts thermal energy waste by 15-25% &amp; stops costly acid wash downtime</text>
</svg>
