<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="socBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <filter id="shadowS" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E40AF" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#socBg)" />

  <!-- Multi-Tower Society Graphic -->
  <g transform="translate(150, 60)" filter="url(#shadowS)">
    <!-- Tower 1 -->
    <rect x="20" y="40" width="90" height="190" rx="4" fill="#3B82F6" />
    <!-- Windows T1 -->
    <g fill="#DBEAFE">
      <rect x="35" y="55" width="16" height="16" rx="2" />
      <rect x="65" y="55" width="16" height="16" rx="2" />
      <rect x="35" y="85" width="16" height="16" rx="2" />
      <rect x="65" y="85" width="16" height="16" rx="2" />
      <rect x="35" y="115" width="16" height="16" rx="2" />
      <rect x="65" y="115" width="16" height="16" rx="2" />
      <rect x="35" y="145" width="16" height="16" rx="2" />
      <rect x="65" y="145" width="16" height="16" rx="2" />
      <rect x="35" y="175" width="16" height="16" rx="2" />
      <rect x="65" y="175" width="16" height="16" rx="2" />
    </g>

    <!-- Tower 2 (Main high-rise) -->
    <rect x="130" y="10" width="120" height="220" rx="4" fill="#1D4ED8" />
    <!-- Overhead Water Tank -->
    <rect x="160" y="-8" width="60" height="18" rx="4" fill="#60A5FA" />
    <!-- Windows T2 -->
    <g fill="#FFFFFF">
      <rect x="145" y="25" width="18" height="18" rx="2" />
      <rect x="180" y="25" width="18" height="18" rx="2" />
      <rect x="215" y="25" width="18" height="18" rx="2" />
      <rect x="145" y="55" width="18" height="18" rx="2" />
      <rect x="180" y="55" width="18" height="18" rx="2" />
      <rect x="215" y="55" width="18" height="18" rx="2" />
      <rect x="145" y="85" width="18" height="18" rx="2" />
      <rect x="180" y="85" width="18" height="18" rx="2" />
      <rect x="215" y="85" width="18" height="18" rx="2" />
      <rect x="145" y="115" width="18" height="18" rx="2" />
      <rect x="180" y="115" width="18" height="18" rx="2" />
      <rect x="215" y="115" width="18" height="18" rx="2" />
      <rect x="145" y="145" width="18" height="18" rx="2" />
      <rect x="180" y="145" width="18" height="18" rx="2" />
      <rect x="215" y="145" width="18" height="18" rx="2" />
    </g>

    <!-- Central Borewell Pipeline Badge -->
    <circle cx="-10" cy="180" r="28" fill="#FFFFFF" />
    <text x="-10" y="188" font-size="22" text-anchor="middle">🏢</text>
  </g>

  <!-- Title & Features -->
  <rect x="40" y="280" width="520" height="90" rx="12" fill="#FFFFFF" filter="url(#shadowS)" />
  <text x="60" y="312" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#0F172A">Housing Societies &amp; Common Borewells</text>
  <text x="60" y="336" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Single installation on main overhead tank or central borewell line</text>
  <text x="60" y="354" font-family="system-ui, sans-serif" font-size="13" fill="#475569">• Eliminates ₹30,000+ monthly salt costs &amp; plumbing breakdown complaints</text>
</svg>
