<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="logoDropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Water Drop & Flow Icon -->
  <g transform="translate(10, 8)">
    <!-- Outer Conditioning Ring -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="url(#silverRing)" stroke-width="3" stroke-dasharray="6 3" />
    <!-- Dynamic Water Waves / Drop -->
    <path d="M32 8 C32 8, 14 28, 14 38 C14 47.94 22.06 56 32 56 C41.94 56 50 47.94 50 38 C50 28, 32 8, 32 8 Z" fill="url(#logoDropGrad)" />
    <!-- Inner Swirl Core / Catalytic Flow -->
    <path d="M26 36 C28 30, 36 30, 38 36 C40 42, 30 46, 28 42" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="35" cy="24" r="3" fill="#FFFFFF" opacity="0.8" />
  </g>

  <!-- Typography -->
  <g transform="translate(82, 28)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#0B2545" letter-spacing="1">AQUAPRO</text>
    <text x="114" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#0072FF" letter-spacing="0.5">TECH</text>
    <text x="1" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9.5" fill="#134E5E" letter-spacing="2.5">WATER CONDITIONING SYSTEMS</text>
    <text x="1" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="8" fill="#64748B" letter-spacing="0.8">AHMEDABAD • GUJARAT</text>
  </g>
</svg>
