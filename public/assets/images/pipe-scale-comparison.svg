<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgComp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="cleanPipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="20%" stop-color="#F1F5F9" />
      <stop offset="80%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="cleanWater" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="450" rx="20" fill="url(#bgComp)" />

  <text x="400" y="45" font-family="system-ui, sans-serif" font-weight="800" font-size="22" fill="#0F172A" text-anchor="middle">Plumbing Pipe Cross-Section Comparison</text>
  <text x="400" y="70" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#64748B" text-anchor="middle">Untreated Hard Water vs Water Treated with AquaPro Conditioner</text>

  <!-- Left Side: Scaled Pipe -->
  <g transform="translate(180, 220)" filter="url(#dropShadow)">
    <!-- Outer Pipe Wall -->
    <circle cx="0" cy="0" r="110" fill="url(#cleanPipeGrad)" stroke="#475569" stroke-width="4" />
    <!-- Thick Calcified Scale Layer -->
    <circle cx="0" cy="0" r="95" fill="url(#scaleGrad)" />
    <!-- Craggy inner scale contour -->
    <path d="M0 -50 C 20 -48, 35 -30, 45 -10 C 50 15, 30 35, 10 45 C -20 50, -40 30, -45 5 C -48 -20, -25 -45, 0 -50 Z" fill="#78350F" opacity="0.3" />
    <!-- Choked Water Flow Channel -->
    <circle cx="0" cy="0" r="38" fill="#0284C7" opacity="0.85" />
    <text x="0" y="5" font-family="system-ui, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle">CHOKED</text>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="9" fill="#E0F2FE" text-anchor="middle">30% Flow</text>

    <!-- Label Underneath -->
    <rect x="-110" y="130" width="220" height="40" rx="8" fill="#FEE2E2" />
    <text x="0" y="155" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#B91C1C" text-anchor="middle">❌ UNTREATED HARD WATER</text>
  </g>

  <!-- VS Badge in Middle -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="28" fill="#0F172A" />
    <text x="0" y="8" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#38BDF8" text-anchor="middle">VS</text>
  </g>

  <!-- Right Side: Clean Pipe with Conditioner -->
  <g transform="translate(620, 220)" filter="url(#dropShadow)">
    <!-- Outer Pipe Wall -->
    <circle cx="0" cy="0" r="110" fill="url(#cleanPipeGrad)" stroke="#475569" stroke-width="4" />
    <!-- Clean Inner Pipe Surface (No scale) -->
    <circle cx="0" cy="0" r="95" fill="url(#cleanWater)" />
    <!-- Clean flow swirl marks -->
    <path d="M-60 -20 C -20 -60, 40 -40, 70 -10 C 50 40, -10 60, -60 20" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5" stroke-dasharray="6 4" />
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" opacity="0.25" />
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle">100% CLEAN</text>
    <text x="0" y="18" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#FFFFFF" text-anchor="middle">Maximum Flow</text>

    <!-- Label Underneath -->
    <rect x="-110" y="130" width="220" height="40" rx="8" fill="#D1FAE5" />
    <text x="0" y="155" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#047857" text-anchor="middle">✓ CONDITIONED WATER</text>
  </g>
</svg>
